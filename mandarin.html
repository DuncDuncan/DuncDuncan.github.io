<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Food Flashcards</title>

<style>
body {
    margin: 0;
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    cursor: pointer;
    user-select: none; /* Prevents text selection highlighting on rapid clicks */
}

.card {
    padding: 30px;
}

.english {
    font-size: 2rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px; /* Adds space between the emoji and the text */
}

.chinese {
    font-size: 3rem;
    margin-top: 20px;
    color: #ffd700;
}

.pinyin {
    font-size: 2rem;
    margin-top: 10px;
}

.phonetic {
    font-size: 1.5rem;
    margin-top: 10px;
    color: #aaa;
}

.instructions {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #777;
}
button,
input,
select,
textarea,
a {
  outline: none;
}

* {
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>

<div class="card">
    <div id="english" class="english"></div>
    <div id="chinese" class="chinese"></div>
    <div id="pinyin" class="pinyin"></div>
    <div id="phonetic" class="phonetic"></div>
</div>

<div class="instructions">
    Click to reveal • Click again for next word
</div>

<script>
const foods = [
    { english: "Apple", emoji: "🍎", chinese: "苹果", pinyin: "píng guǒ", phonetic: "peeng gwor" },
    { english: "Pork", emoji: "🐷", chinese: "猪肉", pinyin: "zhū ròu", phonetic: "joo roh" },
    { english: "Rice", emoji: "🍚", chinese: "米饭", pinyin: "mǐ fàn", phonetic: "mee fan" },
    { english: "Noodles", emoji: "🍜", chinese: "面条", pinyin: "miàn tiáo", phonetic: "mee-en tyaow" },
    { english: "Chicken", emoji: "🍗", chinese: "鸡肉", pinyin: "jī ròu", phonetic: "jee roh" },
    { english: "Beef", emoji: "🥩", chinese: "牛肉", pinyin: "niú ròu", phonetic: "nyoh roh" },
    { english: "Fish", emoji: "🐟", chinese: "鱼", pinyin: "yú", phonetic: "yoo" },
    { english: "Egg", emoji: "🥚", chinese: "鸡蛋", pinyin: "jī dàn", phonetic: "jee dan" },
    { english: "Bread", emoji: "🍞", chinese: "面包", pinyin: "miàn bāo", phonetic: "mee-en baow" },
    { english: "Banana", emoji: "🍌", chinese: "香蕉", pinyin: "xiāng jiāo", phonetic: "shyang jyaow" },
    { english: "Tea", emoji: "🍵", chinese: "茶", pinyin: "chá", phonetic: "chah" },
    { english: "Dog", emoji: "🐶", chinese: "狗", pinyin: "gǒu", phonetic: "goh" }
];

let currentIndex = 0;
let isRevealed = false;

const elEnglish = document.getElementById('english');
const elChinese = document.getElementById('chinese');
const elPinyin = document.getElementById('pinyin');
const elPhonetic = document.getElementById('phonetic');

// Find a matching voice from the system engine
function getChineseVoice() {
    const voices = window.speechSynthesis.getVoices();
    // Searches for any variation of Chinese locale string (like zh-CN, zh_CN, zh-HK)
    return voices.find(v => v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cmn'));
}

// Ensure voices are warmed up on mobile engines
if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = getChineseVoice;
}

function speakChinese(text) {
    window.speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    const targetVoice = getChineseVoice();
    
    if (targetVoice) {
        // Essential patch for Android Chrome / Samsung Browser compatibility
        utterance.voice = targetVoice;
        utterance.lang = targetVoice.lang;
        utterance.voiceURI = targetVoice.voiceURI;
    } else {
        // Fallback strategy if systems haven't loaded profiles yet
        utterance.lang = 'zh-CN';
    }
    
    window.speechSynthesis.speak(utterance);
}

function updateCard() {
    const currentFood = foods[currentIndex];
    
    elEnglish.innerHTML = `<span>${currentFood.emoji}</span> <span>${currentFood.english}</span>`;
    
    if (isRevealed) {
        elChinese.textContent = currentFood.chinese;
        elPinyin.textContent = currentFood.pinyin;
        elPhonetic.textContent = currentFood.phonetic;
        
        speakChinese(currentFood.chinese);
    } else {
        elChinese.textContent = "";
        elPinyin.textContent = "";
        elPhonetic.textContent = "";
    }
}

document.body.addEventListener('click', () => {
    if (!isRevealed) {
        isRevealed = true;
        updateCard();
    } else {
        isRevealed = false;
        currentIndex = (currentIndex + 1) % foods.length;
        updateCard();
    }
});

updateCard();
</script>

</body>
</html>
