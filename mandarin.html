<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Food Flashcards</title>

<style>
body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    user-select: none; /* Prevents text selection highlighting on rapid clicks */
    overflow: hidden;
}

.card {
    box-sizing: border-box;
    width: min(760px, 100%);
    height: 100%;
    max-height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(8px, 2.5vh, 30px) 18px;
}

.emoji-zone {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Made the emoji large and consistent in both states */
.emoji-display {
    flex: 0 0 auto;
    font-size: 10rem;
    line-height: 1;
}

.chinese {
    font-size: 3rem;
    margin-top: 20px;
    color: #ffd700;
    min-height: 3.5rem; /* Prevents layout shifting when text appears */
}

.pinyin {
    font-size: 2rem;
    margin-top: 10px;
    min-height: 2.3rem;
}

.phonetic {
    font-size: 1.5rem;
    color: #aaa;
}

.choices {
    flex: 0 0 auto;
    align-self: center;
    min-height: 0;
    width: min(100%, 360px, max(192px, calc(100dvh - 180px)));
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: clamp(4px, 1vh, 10px);
    margin-top: clamp(8px, 1.5vh, 16px);
}

.choice {
    box-sizing: border-box;
    min-width: 0;
    min-height: 0;
    padding: clamp(3px, 1vh, 12px);
    border: 1px solid #444;
    border-radius: 6px;
    background: #202020;
    color: white;
    cursor: pointer;
    font: inherit;
}

.choice:hover:not(:disabled) {
    border-color: #ffd700;
    background: #292714;
}

.choice:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 2px;
}

.choice:disabled {
    cursor: default;
}

.choice.correct {
    border-color: #69c779;
    background: #18301d;
}

.choice-chinese,
.choice-pinyin,
.choice-phonetic {
    display: block;
}

.choice-chinese {
    color: #ffd700;
    font-size: 1.4rem;
}

.choice-pinyin {
    margin-top: 3px;
}

.choice-phonetic {
    margin-top: 2px;
    color: #aaa;
    font-size: 0.8rem;
    overflow-wrap: anywhere;
}

.status {
    flex: 0 0 auto;
    min-height: 1.5rem;
    margin-top: clamp(4px, 1vh, 12px);
    color: #aaa;
}

@media (max-width: 520px) {
    .card {
        padding-right: 10px;
        padding-left: 10px;
    }

    .emoji-display {
        font-size: 7rem;
    }

    .choices {
        gap: clamp(4px, 1vh, 8px);
    }

    .choice {
        padding: 4px 2px;
    }

    .choice-chinese {
        font-size: 1.2rem;
    }

    .choice-pinyin {
        font-size: 0.9rem;
    }
}

@media (max-height: 480px) {
    .card {
        padding-top: 6px;
        padding-bottom: 6px;
    }

    .choice {
        padding: 2px 1px;
    }

    .emoji-display {
        font-size: 2.8rem;
    }

    .choices {
        margin-top: 6px;
    }

    .choice-chinese {
        font-size: 0.9rem;
    }

    .choice-pinyin {
        margin-top: 1px;
        font-size: 0.7rem;
    }

    .choice-phonetic {
        margin-top: 1px;
        font-size: 0.6rem;
    }

    .status {
        margin-top: 2px;
        min-height: 1.2rem;
    }
}

.instructions {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #777;
}
button,
input,
select,
textarea,
a {
  outline: none;
}

* {
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>

<div class="card">
    <div class="emoji-zone">
        <div id="emojiDisplay" class="emoji-display"></div>
    </div>
    <div id="choices" class="choices" aria-label="Choose the matching Chinese vocabulary"></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
</div>

<script>
const foods = [
    { english: "Apple", emoji: "🍎", chinese: "苹果", pinyin: "píng guǒ", phonetic: "peeng gwor" },
    { english: "Pork", emoji: "🐷", chinese: "猪肉", pinyin: "zhū ròu", phonetic: "joo roh" },
    { english: "Rice", emoji: "🍚", chinese: "米饭", pinyin: "mǐ fàn", phonetic: "mee fan" },
    { english: "Noodles", emoji: "🍜", chinese: "面条", pinyin: "miàn tiáo", phonetic: "mee-en tyaow" },
    { english: "Chicken", emoji: "🍗", chinese: "鸡肉", pinyin: "jī ròu", phonetic: "jee roh" },
    { english: "Beef", emoji: "🥩", chinese: "牛肉", pinyin: "niú ròu", phonetic: "nyoh roh" },
    { english: "Fish", emoji: "🐟", chinese: "鱼", pinyin: "yú", phonetic: "yoo" },
    { english: "Egg", emoji: "🥚", chinese: "鸡蛋", pinyin: "jī dàn", phonetic: "jee dan" },
    { english: "Bread", emoji: "🍞", chinese: "面包", pinyin: "miàn bāo", phonetic: "mee-en baow" },
    { english: "Banana", emoji: "🍌", chinese: "香蕉", pinyin: "xiāng jiāo", phonetic: "shyang jyaow" },
    { english: "Dumplings", emoji: "🥟", chinese: "饺子", pinyin: "jiǎo zi", phonetic: "jyaow dzuh" },
    { english: "Fried Rice", emoji: "🥡", chinese: "炒饭", pinyin: "chǎo fàn", phonetic: "chaow fan" }, // Changed to Takeout Box to avoid duplicates
    { english: "Soup", emoji: "🥣", chinese: "汤", pinyin: "tāng", phonetic: "tahng" },
    { english: "Vegetables", emoji: "🥬", chinese: "蔬菜", pinyin: "shū cài", phonetic: "shoo tsai" },
    { english: "Pork Bun", emoji: "🥮", chinese: "包子", pinyin: "bāo zi", phonetic: "baow dzuh" },
    { english: "Duck", emoji: "🦆", chinese: "鸭肉", pinyin: "yā ròu", phonetic: "yah roh" },
    { english: "Hotpot", emoji: "🍲", chinese: "火锅", pinyin: "huǒ guō", phonetic: "hwor gwor" },
    { english: "Tofu", emoji: "🍢", chinese: "豆腐", pinyin: "dòu fu", phonetic: "doh foo" }, // Changed to Oden/Skewer to visually look like bean curd cubes
    { english: "Tea", emoji: "🍵", chinese: "茶", pinyin: "chá", phonetic: "chah" },
    { english: "Water", emoji: "💧", chinese: "水", pinyin: "shuǐ", phonetic: "shway" },
    { english: "Milk", emoji: "🥛", chinese: "牛奶", pinyin: "niú nǎi", phonetic: "nyoh nai" },
    { english: "Coffee", emoji: "☕", chinese: "咖啡", pinyin: "kā fēi", phonetic: "kah fay" },
    { english: "Juice", emoji: "🧃", chinese: "果汁", pinyin: "guǒ zhī", phonetic: "gwor jir" },
    { english: "Beer", emoji: "🍺", chinese: "啤酒", pinyin: "pí jiǔ", phonetic: "pee jyoh" },
    { english: "Dog", emoji: "🐶", chinese: "狗", pinyin: "gǒu", phonetic: "goh" },
    { english: "Cat", emoji: "🐱", chinese: "猫", pinyin: "māo", phonetic: "maow" },
    { english: "Chili", emoji: "🌶️", chinese: "辣椒", pinyin: "là jiāo", phonetic: "lah jyaow" }, // New addition
    { english: "Shrimp", emoji: "🍤", chinese: "虾", pinyin: "xiā", phonetic: "shyah" }          // New addition
];

const failureStorageKey = 'mandarin-food-failures';
const answerTimeStorageKey = 'mandarin-food-answer-times';
const maxTrackedAnswerTimeMs = 60000;

function shuffleDeck(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function loadFailureCounts() {
    try {
        const savedCounts = JSON.parse(localStorage.getItem(failureStorageKey) || '{}');
        return Object.fromEntries(foods.map(food => {
            const count = savedCounts[food.english];
            return [food.english, Number.isSafeInteger(count) && count > 0 ? count : 0];
        }));
    } catch {
        return Object.fromEntries(foods.map(food => [food.english, 0]));
    }
}

const failureCounts = loadFailureCounts();

function loadAnswerTimes() {
    try {
        const savedTimes = JSON.parse(localStorage.getItem(answerTimeStorageKey) || '{}');
        return Object.fromEntries(foods.map(food => {
            const record = savedTimes[food.english];
            if (!record || !Number.isFinite(record.averageMs) || !Number.isSafeInteger(record.samples) || record.averageMs < 0 || record.samples < 1) {
                return [food.english, { averageMs: 0, samples: 0 }];
            }
            return [food.english, { averageMs: record.averageMs, samples: record.samples }];
        }));
    } catch {
        return Object.fromEntries(foods.map(food => [food.english, { averageMs: 0, samples: 0 }]));
    }
}

const answerTimes = loadAnswerTimes();

function saveFailureCounts() {
    try {
        localStorage.setItem(failureStorageKey, JSON.stringify(failureCounts));
    } catch {}
}

function saveAnswerTimes() {
    try {
        localStorage.setItem(answerTimeStorageKey, JSON.stringify(answerTimes));
    } catch {}
}

function recordAnswerTime(food, elapsedMs) {
    const record = answerTimes[food.english];
    const duration = Math.min(elapsedMs, maxTrackedAnswerTimeMs);
    record.averageMs += (duration - record.averageMs) / (record.samples + 1);
    record.samples += 1;
    saveAnswerTimes();
}

function getFoodWeight(food) {
    const averageMs = Math.min(answerTimes[food.english].averageMs, maxTrackedAnswerTimeMs);
    const timeFactor = 1 + averageMs / 5000;
    return (1 + failureCounts[food.english]) * timeFactor;
}

function chooseNextFood(previousFood) {
    const candidates = foods.filter(food => food !== previousFood);
    const totalWeight = candidates.reduce((total, food) => total + getFoodWeight(food), 0);
    let randomWeight = Math.random() * totalWeight;

    for (const food of candidates) {
        randomWeight -= getFoodWeight(food);
        if (randomWeight < 0) {
            return food;
        }
    }

    return candidates[candidates.length - 1];
}

let currentFood = chooseNextFood();
let questionStartedAt = 0;

const elEmojiDisplay = document.getElementById('emojiDisplay');
const elChoices = document.getElementById('choices');
const elStatus = document.getElementById('status');

// Find a matching voice from the system engine
function getChineseVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cmn'));
}

if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = getChineseVoice;
}

function speakChinese(text, onEnd) {
    window.speechSynthesis.cancel();

    let hasAdvanced = false;
    const fallbackTimer = window.setTimeout(advance, 5000);

    function advance() {
        if (hasAdvanced) {
            return;
        }

        hasAdvanced = true;
        window.clearTimeout(fallbackTimer);
        onEnd();
    }

    const utterance = new SpeechSynthesisUtterance(text);
    const targetVoice = getChineseVoice();
    
    if (targetVoice) {
        utterance.voice = targetVoice;
        utterance.lang = targetVoice.lang;
        utterance.voiceURI = targetVoice.voiceURI;
    } else {
        utterance.lang = 'zh-CN';
    }

    utterance.onend = advance;
    utterance.onerror = advance;

    try {
        window.speechSynthesis.speak(utterance);
    } catch {
        advance();
    }
}

function updateCard() {
    const questionFood = currentFood;
    questionStartedAt = performance.now();
    elEmojiDisplay.textContent = questionFood.emoji;
    elStatus.textContent = '';
    elChoices.replaceChildren();

    const distractors = foods.filter(food => food !== questionFood);
    shuffleDeck(distractors);
    const choices = [questionFood, ...distractors.slice(0, 8)];
    shuffleDeck(choices);

    choices.forEach(food => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.innerHTML = `<span class="choice-chinese"></span><span class="choice-pinyin"></span><span class="choice-phonetic"></span>`;
        button.querySelector('.choice-chinese').textContent = food.chinese;
        button.querySelector('.choice-pinyin').textContent = food.pinyin;
        button.querySelector('.choice-phonetic').textContent = food.phonetic;
        button.addEventListener('click', () => selectAnswer(button, food, questionFood));
        elChoices.appendChild(button);
    });
}

function selectAnswer(button, selectedFood, questionFood) {
    if (selectedFood !== questionFood) {
        failureCounts[questionFood.english] += 1;
        saveFailureCounts();
        elStatus.textContent = `Try again. Missed ${failureCounts[questionFood.english]} time(s).`;
        return;
    }

    recordAnswerTime(questionFood, performance.now() - questionStartedAt);
    elStatus.textContent = 'Correct';
    button.classList.add('correct');
    elChoices.querySelectorAll('button').forEach(choice => {
        choice.disabled = true;
    });

    speakChinese(questionFood.chinese, () => {
        currentFood = chooseNextFood(questionFood);
        updateCard();
    });
}

updateCard();
</script>

</body>
</html>
