<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandarin Vocabulary Quiz</title>

<style>
body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    user-select: none; /* Prevents text selection highlighting on rapid clicks */
    overflow: hidden;
}

.card {
    box-sizing: border-box;
    width: min(760px, 100%);
    height: 100%;
    max-height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(8px, 2.5vh, 30px) 18px;
}

.practice-stats {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1;
    display: grid;
    gap: 5px;
    width: 92px;
    color: #aaa;
    font-size: 0.75rem;
    text-align: left;
    pointer-events: none;
}

.practice-stats div {
    display: flex;
    justify-content: space-between;
    gap: 4px;
}

.practice-stats strong {
    color: #ffd700;
    font-variant-numeric: tabular-nums;
}

.emoji-zone {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Made the emoji large and consistent in both states */
.emoji-display {
    flex: 0 0 auto;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 10rem;
    line-height: 1;
}

.emoji-display:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 4px;
}

.english-label {
    min-height: 1.4em;
    margin-top: 4px;
    color: #aaa;
    font-size: 1rem;
    visibility: hidden;
}

.english-label.is-visible {
    visibility: visible;
}

.chinese {
    font-size: 3rem;
    margin-top: 20px;
    color: #ffd700;
    min-height: 3.5rem; /* Prevents layout shifting when text appears */
}

.pinyin {
    font-size: 2rem;
    margin-top: 10px;
    min-height: 2.3rem;
}

.phonetic {
    font-size: 1.5rem;
    color: #aaa;
}

.choices {
    flex: 0 0 auto;
    align-self: center;
    min-height: 0;
    width: min(100%, 360px, max(192px, calc(100dvh - 180px)));
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: clamp(4px, 1vh, 10px);
    margin-top: clamp(8px, 1.5vh, 16px);
}

.choice {
    box-sizing: border-box;
    min-width: 0;
    min-height: 0;
    padding: clamp(3px, 1vh, 12px);
    border: 1px solid #444;
    border-radius: 6px;
    background: #202020;
    color: white;
    cursor: pointer;
    font: inherit;
}

.choice:hover:not(:disabled) {
    border-color: #ffd700;
    background: #292714;
}

.choice:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 2px;
}

.choice:disabled {
    cursor: default;
}

.choice.correct {
    border-color: #69c779;
    background: #18301d;
}

.choice-chinese,
.choice-pinyin,
.choice-phonetic {
    display: block;
}

.choice-chinese {
    color: #ffd700;
    font-size: 1.4rem;
}

.choice-pinyin {
    margin-top: 3px;
}

.choice-phonetic {
    margin-top: 2px;
    color: #aaa;
    font-size: 0.8rem;
    overflow-wrap: anywhere;
}

.status {
    flex: 0 0 auto;
    min-height: 1.5rem;
    margin-top: clamp(4px, 1vh, 12px);
    color: #aaa;
}

@media (max-width: 520px) {
    .card {
        padding-right: 10px;
        padding-left: 10px;
    }

    .emoji-display {
        font-size: 7rem;
    }

    .choices {
        gap: clamp(4px, 1vh, 8px);
    }

    .choice {
        padding: 4px 2px;
    }

    .choice-chinese {
        font-size: 1.2rem;
    }

    .choice-pinyin {
        font-size: 0.9rem;
    }
}

@media (max-height: 480px) {
    .card {
        padding-top: 6px;
        padding-bottom: 6px;
    }

    .choice {
        padding: 2px 1px;
    }

    .emoji-display {
        font-size: 2.8rem;
    }

    .choices {
        margin-top: 6px;
    }

    .choice-chinese {
        font-size: 0.9rem;
    }

    .choice-pinyin {
        margin-top: 1px;
        font-size: 0.7rem;
    }

    .choice-phonetic {
        margin-top: 1px;
        font-size: 0.6rem;
    }

    .status {
        margin-top: 2px;
        min-height: 1.2rem;
    }
}

.instructions {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #777;
}
button,
input,
select,
textarea,
a {
  outline: none;
}

* {
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>

const missHistoryStorageKey = 'mandarin-food-miss-history';
const answerTimeStorageKey = 'mandarin-food-answer-times';
const maxTrackedAnswerTimeMs = 60000;
const newItemSeedWeights = [10000, 1000, 100, 10, 1];

function shuffleDeck(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function loadMissHistory() {
    try {
        const savedHistory = JSON.parse(localStorage.getItem(missHistoryStorageKey) || '{}');
        return Object.fromEntries(vocabularyItems.map(item => [
            item.english,
            Array.isArray(savedHistory[item.english])
                ? savedHistory[item.english].filter(misses => Number.isSafeInteger(misses) && misses >= 0).slice(-10)
                : []
        ]));
    } catch {
        return Object.fromEntries(vocabularyItems.map(item => [item.english, []]));
    }
}

const recentMissHistory = loadMissHistory();

function loadAnswerTimes() {
    try {
        const savedTimes = JSON.parse(localStorage.getItem(answerTimeStorageKey) || '{}');
        return Object.fromEntries(vocabularyItems.map(item => {
            const record = savedTimes[item.english];
            if (!record) {
                return [item.english, { durations: [], averageMs: 0, samples: 0 }];
            }

            const durations = Array.isArray(record.durations)
                ? record.durations
                    .filter(duration => Number.isFinite(duration) && duration >= 0)
                    .slice(-10)
                    .map(duration => Math.min(duration, maxTrackedAnswerTimeMs))
                : Number.isFinite(record.averageMs) && record.averageMs >= 0
                    ? [Math.min(record.averageMs, maxTrackedAnswerTimeMs)]
                    : [];
            const averageMs = durations.length
                ? durations.reduce((total, duration) => total + duration, 0) / durations.length
                : 0;
            return [item.english, { durations, averageMs, samples: durations.length }];
        }));
    } catch {
        return Object.fromEntries(vocabularyItems.map(item => [item.english, { durations: [], averageMs: 0, samples: 0 }]));
    }
}

const answerTimes = loadAnswerTimes();

function getRecentMissCount(item) {
    return recentMissHistory[item.english].reduce((total, misses) => total + misses, 0);
}

function saveMissHistory() {
    try {
        localStorage.setItem(missHistoryStorageKey, JSON.stringify(recentMissHistory));
    } catch {}
}

function recordAppearanceMisses(item, misses) {
    const history = recentMissHistory[item.english];
    history.push(misses);
    if (history.length > 10) {
        history.shift();
    }
    saveMissHistory();
}

function saveAnswerTimes() {
    try {
        localStorage.setItem(answerTimeStorageKey, JSON.stringify(answerTimes));
    } catch {}
}

function recordAnswerTime(item, elapsedMs) {
    const record = answerTimes[item.english];
    const duration = Math.min(elapsedMs, maxTrackedAnswerTimeMs);
    record.durations.push(duration);
    if (record.durations.length > 10) {
        record.durations.shift();
    }
    record.samples = record.durations.length;
    record.averageMs = record.durations.reduce((total, sample) => total + sample, 0) / record.samples;
    saveAnswerTimes();
}

function getItemWeightDetails(item) {
    const misses = getRecentMissCount(item);
    const answerTime = answerTimes[item.english];
    const averageMs = Math.min(answerTime.averageMs, maxTrackedAnswerTimeMs);
    const appearances = Math.max(recentMissHistory[item.english].length, answerTime.samples);
    const missFactor = 1 + misses;
    const timeFactor = 1 + averageMs / 5000;
    const seedFactor = newItemSeedWeights[appearances] ?? 1;
    const weightBeforeBoost = missFactor * timeFactor;
    const weight = weightBeforeBoost * seedFactor;
    return {
        misses,
        recentAnswerTimesSeconds: answerTime.durations.map(duration => Number((duration / 1000).toFixed(2))),
        averageAnswerTimeSeconds: Number((averageMs / 1000).toFixed(2)),
        missFactor,
        timeFactor: Number(timeFactor.toFixed(3)),
        seedFactor,
        weightBeforeBoost,
        weight
    };
}

function logItemSelection(selection, totalWeight) {
    const selectionChancePercent = (selection.weight / totalWeight * 100).toFixed(2);
    console.log(`selectionChancePercent=${selectionChancePercent}%, misses=${selection.misses}, recentAnswerTimesSeconds=[${selection.recentAnswerTimesSeconds.join(', ')}], weight=${selection.weightBeforeBoost.toFixed(3)}, seedFactor=${selection.seedFactor}, boostedWeight=${selection.weight.toFixed(3)}`);
}

function chooseNextItem(previousItem) {
    const candidates = vocabularyItems.filter(item => item !== previousItem);
    const weightedCandidates = candidates.map(item => ({ item, ...getItemWeightDetails(item) }));
    const totalWeight = weightedCandidates.reduce((total, selection) => total + selection.weight, 0);
    let randomWeight = Math.random() * totalWeight;

    for (const selection of weightedCandidates) {
        randomWeight -= selection.weight;
        if (randomWeight < 0) {
            logItemSelection(selection, totalWeight);
            return selection.item;
        }
    }

    const selection = weightedCandidates[weightedCandidates.length - 1];
    logItemSelection(selection, totalWeight);
    return selection.item;
}

let currentItem = chooseNextItem();
let questionStartedAt = 0;
let currentRoundMisses = 0;

const elEmojiDisplay = document.getElementById('emojiDisplay');
const elEnglishLabel = document.getElementById('englishLabel');
const elChoices = document.getElementById('choices');
const elStatus = document.getElementById('status');
const elMissCount = document.getElementById('missCount');
const elAverageTime = document.getElementById('averageTime');

function updatePracticeStats(item) {
    const answerTime = answerTimes[item.english];
    elMissCount.textContent = getRecentMissCount(item) + (item === currentItem ? currentRoundMisses : 0);
    elAverageTime.textContent = answerTime.samples > 0
        ? `${(answerTime.averageMs / 1000).toFixed(1)}s`
        : '-';
}

// Find a matching voice from the system engine
function getChineseVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cmn'));
}

if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = getChineseVoice;
}

function speakChinese(text, onEnd) {
    window.speechSynthesis.cancel();

    let hasAdvanced = false;
    const fallbackTimer = window.setTimeout(advance, 5000);

    function advance() {
        if (hasAdvanced) {
            return;
        }

        hasAdvanced = true;
        window.clearTimeout(fallbackTimer);
        onEnd();
    }

    const utterance = new SpeechSynthesisUtterance(text);
    const targetVoice = getChineseVoice();
    
    if (targetVoice) {
        utterance.voice = targetVoice;
        utterance.lang = targetVoice.lang;
        utterance.voiceURI = targetVoice.voiceURI;
    } else {
        utterance.lang = 'zh-CN';
    }

    utterance.onend = advance;
    utterance.onerror = advance;

    try {
        window.speechSynthesis.speak(utterance);
    } catch {
        advance();
    }
}

function updateCard() {
    const questionItem = currentItem;
    questionStartedAt = performance.now();
    currentRoundMisses = 0;
    updatePracticeStats(questionItem);
    elEmojiDisplay.textContent = questionItem.emoji;
    elEmojiDisplay.setAttribute('aria-expanded', 'false');
    elEnglishLabel.textContent = questionItem.english;
    elEnglishLabel.classList.remove('is-visible');
    elStatus.textContent = '';
    elChoices.replaceChildren();

    const distractors = vocabularyItems.filter(item => item !== questionItem);
    shuffleDeck(distractors);
    const choices = [questionItem, ...distractors.slice(0, 8)];
    shuffleDeck(choices);

    choices.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.innerHTML = `<span class="choice-chinese"></span><span class="choice-pinyin"></span><span class="choice-phonetic"></span>`;
        button.querySelector('.choice-chinese').textContent = item.chinese;
        button.querySelector('.choice-pinyin').textContent = item.pinyin;
        button.querySelector('.choice-phonetic').textContent = item.phonetic;
        button.addEventListener('click', () => selectAnswer(button, item, questionItem));
        elChoices.appendChild(button);
    });
}

elEmojiDisplay.addEventListener('click', () => {
    elEnglishLabel.classList.add('is-visible');
    elEmojiDisplay.setAttribute('aria-expanded', 'true');
});

function selectAnswer(button, selectedItem, questionItem) {
    if (selectedItem !== questionItem) {
        currentRoundMisses += 1;
        updatePracticeStats(questionItem);
        elStatus.textContent = `Try again. Missed ${currentRoundMisses} time(s) this round.`;
        return;
    }

    recordAppearanceMisses(questionItem, currentRoundMisses);
    currentRoundMisses = 0;
    recordAnswerTime(questionItem, performance.now() - questionStartedAt);
    updatePracticeStats(questionItem);
    elStatus.textContent = 'Correct';
    button.classList.add('correct');
    elChoices.querySelectorAll('button').forEach(choice => {
        choice.disabled = true;
    });

    speakChinese(questionItem.chinese, () => {
        currentItem = chooseNextItem(questionItem);
        updateCard();
    });
}

updateCard();
</script>
