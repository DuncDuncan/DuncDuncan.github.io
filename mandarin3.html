<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Food Flashcards with Voice Input</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    user-select: none;
}

.card {
    padding: 30px;
    width: 100%;
    max-width: 500px;
}

.emoji-display {
    font-size: 10rem;
    margin-bottom: 10px;
}

.chinese {
    font-size: 3rem;
    margin-top: 20px;
    color: #ffd700;
    min-height: 3.5rem;
}

.pinyin {
    font-size: 2rem;
    margin-top: 10px;
    min-height: 2.3rem;
}

.phonetic {
    font-size: 1.5rem;
    margin-top: 10px;
    color: #aaa;
    min-height: 1.8rem;
}

/* Mic Button Interface */
.mic-control-btn {
    background: #e62117;
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 15px;
    box-shadow: 0 4px 15px rgba(230, 33, 23, 0.4);
    transition: all 0.3s ease;
}

.mic-control-btn.active {
    background: #00ffcc;
    color: #111;
    box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
}

.voice-status {
    margin-top: 15px;
    font-size: 1.2rem;
    color: #888;
    min-height: 1.5rem;
}

.debug-panel {
    margin-top: 15px;
    padding: 10px;
    background: #222;
    border: 1px dashed #444;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.9rem;
    color: #666;
}

.debug-text {
    color: #ffaa00;
    font-weight: bold;
}

.instructions {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #777;
    left: 0;
    right: 0;
}
</style>
</head>
<body>

<div class="card" aria-live="polite">
    <div id="emojiDisplay" class="emoji-display"></div>
    <div id="chinese" class="chinese"></div>
    <div id="pinyin" class="pinyin"></div>
    <div id="phonetic" class="phonetic"></div>
    
    <button id="micToggleBtn" class="mic-control-btn">🔴 Click to Turn Mic ON</button>
    <div id="voiceStatus" class="voice-status">Microphone is offline</div>
    
    <div class="debug-panel">
        Live Mic Transcription: <span id="debugText" class="debug-text">...</span>
    </div>
</div>

<div class="instructions">
    Turn mic ON • Say your answer aloud • Or click emoji to reveal/skip
</div>

<script>
const foods = [
    { english: "Dog", emoji: "🐶", chinese: "狗", pinyin: "gǒu", phonetic: "goh", matches: ["狗", "小狗", "公狗", "母狗"] },
    { english: "Cat", emoji: "🐱", chinese: "猫", pinyin: "māo", phonetic: "maow", matches: ["猫", "小猫", "猫咪", "公猫", "母猫"] },
    { english: "Chili", emoji: "🌶️", chinese: "辣椒", pinyin: "là jiāo", phonetic: "lah jyaow", matches: ["辣椒", "辣", "辣酱"] },
    { english: "Shrimp", emoji: "🍤", chinese: "虾", pinyin: "xiā", phonetic: "shyah", matches: ["虾", "大虾", "虾仁", "虾子"] },
    { english: "Water", emoji: "💧", chinese: "水", pinyin: "shuǐ", phonetic: "shway", matches: ["水", "白水", "开水", "饮用水"] },
    { english: "Rice", emoji: "🍚", chinese: "米饭", pinyin: "mǐ fàn", phonetic: "mee fan", matches: ["米饭", "饭", "大米", "白米饭"] },
    { english: "Noodles", emoji: "🍜", chinese: "面条", pinyin: "miàn tiáo", phonetic: "mee-en tyaow", matches: ["面条", "面", "拉面", "汤面"] },
    { english: "Apple", emoji: "🍎", chinese: "苹果", pinyin: "píng guǒ", phonetic: "peeng gwor", matches: ["苹果", "青苹果", "红苹果"] },
    { english: "Pork", emoji: "🐷", chinese: "猪肉", pinyin: "zhū ròu", phonetic: "joo roh", matches: ["猪肉", "猪", "肉"] },
    { english: "Chicken", emoji: "🍗", chinese: "鸡肉", pinyin: "jī ròu", phonetic: "jee roh", matches: ["鸡肉", "鸡", "小鸡"] },
    { english: "Beef", emoji: "🥩", chinese: "牛肉", pinyin: "niú ròu", phonetic: "nyoh roh", matches: ["牛肉", "牛", "牛排"] },
    { english: "Fish", emoji: "🐟", chinese: "鱼", pinyin: "yú", phonetic: "yoo", matches: ["鱼", "小鱼", "鲜鱼", "一条鱼"] },
    { english: "Egg", emoji: "🥚", chinese: "鸡蛋", pinyin: "jī dàn", phonetic: "jee dan", matches: ["鸡蛋", "蛋", "鸡子儿"] },
    { english: "Bread", emoji: "🍞", chinese: "面包", pinyin: "miàn bāo", phonetic: "mee-en baow", matches: ["面包", "吐司", "大面包"] },
    { english: "Banana", emoji: "🍌", chinese: "香蕉", pinyin: "xiāng jiāo", phonetic: "shyang jyaow", matches: ["香蕉", "蕉", "大香蕉"] },
    { english: "Dumplings", emoji: "🥟", chinese: "饺子", pinyin: "jiǎo zi", phonetic: "jyaow dzuh", matches: ["饺子", "水饺", "蒸饺", "饺"] },
    { english: "Fried Rice", emoji: "🥡", chinese: "炒饭", pinyin: "chǎo fàn", phonetic: "chaow fan", matches: ["炒饭", "蛋炒饭", "炒米饭"] },
    { english: "Soup", emoji: "🥣", chinese: "汤", pinyin: "tāng", phonetic: "tahng", matches: ["汤", "热汤", "菜汤", "喝汤"] },
    { english: "Vegetables", emoji: "🥬", chinese: "蔬菜", pinyin: "shū cài", phonetic: "shoo tsai", matches: ["蔬菜", "菜", "青菜", "白菜"] },
    { english: "Pork Bun", emoji: "🥮", chinese: "包子", pinyin: "bāo zi", phonetic: "baow dzuh", matches: ["包子", "肉包", "肉包子", "小笼包"] },
    { english: "Duck", emoji: "🦆", chinese: "鸭肉", pinyin: "yā ròu", phonetic: "yah roh", matches: ["鸭肉", "鸭", "烤鸭"] },
    { english: "Hotpot", emoji: "🍲", chinese: "火锅", pinyin: "huǒ guō", phonetic: "hwor gwor", matches: ["火锅", "吃火锅", "麻辣火锅"] },
    { english: "Tofu", emoji: "🍢", chinese: "豆腐", pinyin: "dòu fu", phonetic: "doh foo", matches: ["豆腐", "冻豆腐", "麻婆豆腐"] },
    { english: "Tea", emoji: "🍵", chinese: "茶", pinyin: "chá", phonetic: "chah", matches: ["茶", "绿茶", "红茶", "喝茶"] },
    { english: "Milk", emoji: "🥛", chinese: "牛奶", pinyin: "niú nǎi", phonetic: "nyoh nai", matches: ["牛奶", "奶", "鲜牛奶"] },
    { english: "Coffee", emoji: "☕", chinese: "咖啡", pinyin: "kā fēi", phonetic: "kah fay", matches: ["咖啡", "热咖啡", "冰咖啡"] },
    { english: "Juice", emoji: "🧃", chinese: "果汁", pinyin: "guǒ zhī", phonetic: "gwor jir", matches: ["果汁", "水果汁", "鲜榨果汁"] },
    { english: "Beer", emoji: "🍺", chinese: "啤酒", pinyin: "pí jiǔ", phonetic: "pee jyoh", matches: ["啤酒", "喝啤酒", "冰啤酒"] }
];

let currentIndex = 0;
let isRevealed = false;
let isMicOn = false;
let processingLock = false;

const elEmojiDisplay = document.getElementById('emojiDisplay');
const elChinese = document.getElementById('chinese');
const elPinyin = document.getElementById('pinyin');
const elPhonetic = document.getElementById('phonetic');
const elVoiceStatus = document.getElementById('voiceStatus');
const elDebugText = document.getElementById('debugText');
const micToggleBtn = document.getElementById('micToggleBtn');

function getChineseVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cmn'));
}

function speakChinese(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const targetVoice = getChineseVoice();
    if (targetVoice) { utterance.voice = targetVoice; utterance.lang = targetVoice.lang; }
    else { utterance.lang = 'zh-CN'; }
    window.speechSynthesis.speak(utterance);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US'; 

    recognition.onstart = () => {
        isMicOn = true;
        micToggleBtn.textContent = "🟢 Mic is LIVE (Listening)";
        micToggleBtn.classList.add('active');
        elVoiceStatus.textContent = "Say the word aloud...";
    };

    recognition.onresult = (event) => {
        if (processingLock) return;

        let liveText = '';
        // Bulletproof result string compilation loop
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i] && event.results[i][0]) {
                liveText += event.results[i][0].transcript;
            }
        }

        liveText = liveText.trim().toLowerCase();
        elDebugText.textContent = liveText || "...";

        if (!liveText) return;

        const currentFood = foods[currentIndex];
        const hasMatch = currentFood.matches.some(pattern => liveText.includes(pattern));

        if (hasMatch) {
            processingLock = true;
            elVoiceStatus.textContent = "Correct Match detected! 🎉";
            elDebugText.style.color = "#00ff00";
            
            if (!isRevealed) {
                isRevealed = true;
                updateCard();
                setTimeout(() => {
                    isRevealed = false;
                    currentIndex = (currentIndex + 1) % foods.length;
                    processingLock = false;
                    elDebugText.style.color = "#ffaa00";
                    updateCard();
                }, 2000);
            }
        }
    };

    recognition.onerror = (e) => {
        console.log("Mic Error: ", e.error);
        if(e.error === 'not-allowed') {
            elVoiceStatus.textContent = "Permission denied. Check address bar icon!";
        }
    };

    recognition.onend = () => {
        if (isMicOn) { try { recognition.start(); } catch(err){} }
    };
}

function updateCard() {
    const currentFood = foods[currentIndex];
    elEmojiDisplay.innerHTML = `<span>${currentFood.emoji}</span>`;
    
    if (isRevealed) {
        elChinese.textContent = currentFood.chinese;
        elPinyin.textContent = currentFood.pinyin;
        elPhonetic.textContent = currentFood.phonetic;
        speakChinese(currentFood.chinese);
    } else {
        elChinese.textContent = "";
        elPinyin.textContent = "";
        elPhonetic.textContent = "";
        elDebugText.textContent = "...";
    }
}

micToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!recognition) {
        elVoiceStatus.textContent = "Speech recognition engine unsupported.";
        return;
    }

    if (!isMicOn) {
        try {
            recognition.start();
        } catch(err) {
            console.log(err);
        }
    } else {
        isMicOn = false;
        recognition.stop();
        micToggleBtn.textContent = "🔴 Click to Turn Mic ON";
        micToggleBtn.classList.remove('active');
        elVoiceStatus.textContent = "Microphone is offline";
    }
});

elEmojiDisplay.addEventListener('click', () => {
    if (processingLock) return;
    if (!isRevealed) {
        isRevealed = true;
        updateCard();
    } else {
        isRevealed = false;
        currentIndex = (currentIndex + 1) % foods.length;
        updateCard();
    }
});

updateCard();
</script>

</body>
</html>
