<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandarin Vocabulary Quiz</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    user-select: none;
    overflow-x: hidden;
    overflow-y: auto;
}

.card {
    box-sizing: border-box;
    width: min(760px, 100%);
    flex: 1 0 auto;
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: clamp(8px, 2.5vh, 30px) 18px;
    position: relative;
}

.ranking-section {
    box-sizing: border-box;
    flex: 0 0 auto;
    width: min(760px, 100%);
    padding: 22px 18px 48px;
    border-top: 1px solid #333;
}

.ranking-section h2 {
    margin: 0 0 12px;
    color: #ddd;
    font-size: 1rem;
    font-weight: 600;
    text-align: left;
}

.weight-ranking {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    text-align: left;
}

.weight-ranking li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid #292929;
    color: #ccc;
    font-size: 0.9rem;
}

.weight-ranking li.item-disabled {
    opacity: 0.35;
    text-decoration: line-through;
}

.ranking-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.ranking-toggle-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 0 4px;
}

.ranking-weight {
    color: #ffd700;
    font-variant-numeric: tabular-nums;
}

.practice-stats {
    position: absolute;
    top: 44px;
    left: 12px;
    z-index: 1;
    display: grid;
    gap: 5px;
    width: 240px;
    color: #aaa;
    font-size: 0.75rem;
    text-align: left;
    pointer-events: none;
}

.mode-switch {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #aaa;
    font-size: 0.75rem;
    white-space: nowrap;
    cursor: pointer;
}

.mode-switch input {
    position: relative;
    width: 30px;
    height: 18px;
    margin: 0;
    appearance: none;
    border: 1px solid #555;
    border-radius: 10px;
    background: #333;
    cursor: pointer;
}

.mode-switch input::before {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #bbb;
    content: "";
    transition: transform 120ms ease, background 120ms ease;
}

.mode-switch input:checked {
    border-color: #b59c00;
    background: #514700;
}

.mode-switch input:checked::before {
    transform: translateX(12px);
    background: #ffd700;
}

.mode-switch input:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 3px;
}

.category-filters {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    display: flex;
    gap: 4px;
}

.category-toggle {
    padding: 6px 8px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #202020;
    color: #aaa;
    cursor: pointer;
    font: inherit;
    font-size: 0.75rem;
}

.category-toggle[aria-pressed="true"] {
    border-color: #ffd700;
    background: #292714;
    color: #ffd700;
}

.category-toggle:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 2px;
}

.practice-stats div {
    display: grid;
    grid-template-columns: 80px minmax(0, 1fr);
    gap: 8px;
    align-items: center;
}

.practice-stats span {
    white-space: nowrap;
}

.practice-stats strong {
    color: #ffd700;
    font-variant-numeric: tabular-nums;
    display: flex;
    gap: 6px;
}

.emoji-zone {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
}

.emoji-display {
    flex: 0 0 auto;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: min(10rem, 26vh);
    line-height: 1;
}

.emoji-display:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 4px;
}

.english-label {
    min-height: 1.4em;
    margin-top: 4px;
    color: #aaa;
    font-size: 1rem;
    visibility: hidden;
}

.english-label.is-visible {
    visibility: visible;
}

.choices {
    flex: 0 0 auto;
    align-self: center;
    min-height: 0;
    width: min(100%, 360px, max(192px, calc(100dvh - 180px)));
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: clamp(4px, 1vh, 10px);
}

.input-area {
    display: grid;
    flex: 0 0 auto;
    align-items: center;
    justify-items: center;
    width: 100%;
    margin-top: clamp(8px, 1.5vh, 16px);
}

.input-area > * {
    grid-area: 1 / 1;
}

.input-mode-inactive {
    visibility: hidden;
    pointer-events: none;
}

.typing-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
}

.typed-pinyin {
    min-height: 1.5em;
    color: #ffd700;
    font-size: 1.4rem;
}

.letter-keyboard {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: clamp(3px, 0.8vh, 6px);
    width: min(100%, 420px, max(180px, calc((100dvh - 220px) * 6 / 5)));
}

.letter-key {
    display: grid;
    min-width: 0;
    aspect-ratio: 1;
    place-items: center;
    padding: 0;
    border: 1px solid #444;
    border-radius: 5px;
    background: #202020;
    color: white;
    cursor: pointer;
    font: inherit;
    font-size: 1.1rem;
    text-transform: uppercase;
}

.letter-key:hover:not(:disabled) {
    border-color: #ffd700;
    background: #292714;
}

.letter-key:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 2px;
}

.letter-key:disabled {
    cursor: default;
}

.letter-key.correct {
    animation: answer-correct 900ms ease-in-out;
}

.letter-key.wrong {
    animation: answer-wrong 900ms ease-in-out;
}

.choice {
    box-sizing: border-box;
    min-width: 0;
    min-height: 0;
    padding: clamp(3px, 1vh, 12px);
    border: 1px solid #444;
    border-radius: 6px;
    background: #202020;
    color: white;
    cursor: pointer;
    font: inherit;
}

.choice:hover:not(:disabled) {
    border-color: #ffd700;
    background: #292714;
}

.choice:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 2px;
}

.choice:disabled {
    cursor: default;
}

.choice.correct {
    animation: answer-correct 900ms ease-in-out;
}

.choice.wrong {
    animation: answer-wrong 900ms ease-in-out;
}

@keyframes answer-correct {
    0%, 100% {
        border-color: #444;
        background: #202020;
    }
    20%, 60% {
        border-color: #69c779;
        background: #24502b;
    }
}

@keyframes answer-wrong {
    0%, 100% {
        border-color: #444;
        background: #202020;
    }
    20%, 60% {
        border-color: #ed6262;
        background: #572525;
    }
}

.choice-chinese,
.choice-pinyin,
.choice-phonetic {
    display: block;
}

.choice-chinese {
    color: #ffd700;
    font-size: 1.4rem;
}

.choice-pinyin {
    margin-top: 3px;
}

.choice-phonetic {
    margin-top: 2px;
    color: #aaa;
    font-size: 0.8rem;
    overflow-wrap: anywhere;
}

.status {
    flex: 0 0 auto;
    min-height: 1.5rem;
    margin-top: clamp(4px, 1vh, 12px);
    color: #aaa;
}

@media (max-width: 520px) {
    .emoji-display {
        font-size: 7rem;
    }
    .choices {
        gap: clamp(4px, 1vh, 8px);
    }
    .choice {
        padding: 4px 2px;
    }
    .choice-chinese {
        font-size: 1.2rem;
    }
    .choice-pinyin {
        font-size: 0.9rem;
    }
}

@media (max-height: 480px) {
    .choice {
        padding: 2px 1px;
    }
    .emoji-display {
        font-size: 2.8rem;
    }
    .typing-panel {
        gap: 4px;
    }
    .letter-keyboard {
        width: min(100%, 300px);
    }
    .letter-key {
        font-size: 0.85rem;
    }
    .typed-pinyin {
        min-height: 1.2em;
        font-size: 1rem;
    }
    .choice-chinese {
        font-size: 0.9rem;
    }
    .choice-pinyin {
        margin-top: 1px;
        font-size: 0.7rem;
    }
    .choice-phonetic {
        margin-top: 1px;
        font-size: 0.6rem;
    }
    .status {
        margin-top: 2px;
        min-height: 1.2rem;
    }
}

button, input, select, textarea, a {
  outline: none;
}

* {
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>

        <button class="category-toggle" type="button" data-category="food" aria-pressed="true">食物</button>

        <button class="category-toggle" type="button" data-category="numbers" aria-pressed="true">数字</button>

    <div class="emoji-zone">

        <div id="englishLabel" class="english-label" aria-live="polite"></div>
    </div>
    
    <div class="input-area">
        <div id="choices" class="choices" aria-label="Choose the matching Chinese vocabulary"></div>
        <div id="typingPanel" class="typing-panel">

            <div id="letterKeyboard" class="letter-keyboard" aria-label="Pinyin letter keyboard"></div>

    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
</div>

<section class="ranking-section" aria-labelledby="rankingHeading">

    { english: "Money", emoji: "💵", chinese: "钱", pinyin: "qián", phonetic: "chyen" },
    { english: "Bicycle", emoji: "🚲", chinese: "自行车", pinyin: "zì xíng chē", phonetic: "dzuh shing chuh" },
    { english: "Entrance", emoji: "🚪", chinese: "入口", pinyin: "rù kǒu", phonetic: "roo koh" },
    { english: "Exit", emoji: "➡️", chinese: "出口", pinyin: "chū kǒu", phonetic: "choo koh" },
    { english: "Beach", emoji: "🏖️", chinese: "海滩", pinyin: "hǎi tān", phonetic: "hi tan" },
    { english: "Mountain", emoji: "⛰️", chinese: "山", pinyin: "shān", phonetic: "shan" },
    { english: "Zero", emoji: "0️⃣", chinese: "零", pinyin: "líng", phonetic: "ling" },
    { english: "One", emoji: "1️⃣", chinese: "一", pinyin: "yī", phonetic: "ee" },
    { english: "Two", emoji: "2️⃣", chinese: "二", pinyin: "èr", phonetic: "er" },
    { english: "Three", emoji: "3️⃣", chinese: "三", pinyin: "sān", phonetic: "san" },
    { english: "Four", emoji: "4️⃣", chinese: "四", pinyin: "sì", phonetic: "suh" },
    { english: "Five", emoji: "5️⃣", chinese: "五", pinyin: "wǔ", phonetic: "woo" },
    { english: "Six", emoji: "6️⃣", chinese: "六", pinyin: "liù", phonetic: "lyoh" },
    { english: "Seven", emoji: "7️⃣", chinese: "七", pinyin: "qī", phonetic: "chee" },
    { english: "Eight", emoji: "8️⃣", chinese: "八", pinyin: "bā", phonetic: "bah" },
    { english: "Nine", emoji: "9️⃣", chinese: "九", pinyin: "jiǔ", phonetic: "jyoh" },
    { english: "Ten", emoji: "🔟", chinese: "十", pinyin: "shí", phonetic: "shir" }
].map(item => ({
    ...item,
    category: numberVocabulary.has(item.english) ? "numbers" : travelVocabulary.has(item.english) ? "travel" : "food"
}));

const missHistoryStorageKey = 'mandarin-food-miss-history';
const answerTimeStorageKey = 'mandarin-food-answer-times';
const categoryStorageKey = 'mandarin-vocabulary-categories';
const exclusionStorageKey = 'mandarin-vocabulary-exclusions';
const maxTrackedAnswerTimeMs = 60000;

function loadSelectedCategories() {
    try {
        const savedCategories = JSON.parse(localStorage.getItem(categoryStorageKey) || '{}');
        return Object.fromEntries(categoryOrder.map(category => [
            category,
            typeof savedCategories[category] === 'boolean' ? savedCategories[category] : true
        ]));
    } catch {
        return Object.fromEntries(categoryOrder.map(category => [category, true]));
    }
}

function loadExclusions() {
    try {
        return JSON.parse(localStorage.getItem(exclusionStorageKey) || '{}');
    } catch {
        return {};
    }
}

const selectedCategories = loadSelectedCategories();
const itemExclusions = loadExclusions();

function getAvailableItems() {
    return vocabularyItems.filter(item => selectedCategories[item.category] && !itemExclusions[item.english]);
}

function shuffleDeck(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function loadMissHistory() {
    try {
        const savedHistory = JSON.parse(localStorage.getItem(missHistoryStorageKey) || '{}');
        return Object.fromEntries(vocabularyItems.map(item => [
            item.english,
            Array.isArray(savedHistory[item.english])
                ? savedHistory[item.english].filter(misses => Number.isSafeInteger(misses) && misses >= 0).slice(-10)
                : []
        ]));
    } catch {
        return Object.fromEntries(vocabularyItems.map(item => [item.english, []]));
    }
}

const recentMissHistory = loadMissHistory();

function loadAnswerTimes() {
    try {
        const savedTimes = JSON.parse(localStorage.getItem(answerTimeStorageKey) || '{}');
        return Object.fromEntries(vocabularyItems.map(item => {
            const record = savedTimes[item.english];
            if (!record) {
                return [item.english, { durations: [], averageMs: 0, samples: 0 }];
            }
            const durations = Array.isArray(record.durations)
                ? record.durations
                    .filter(duration => Number.isFinite(duration) && duration >= 0)
                    .slice(-10)
                    .map(duration => Math.min(duration, maxTrackedAnswerTimeMs))
                : [];
            const averageMs = durations.length
                ? durations.reduce((total, duration) => total + duration, 0) / durations.length
                : 0;
            return [item.english, { durations, averageMs, samples: durations.length }];
        }));
    } catch {
        return Object.fromEntries(vocabularyItems.map(item => [item.english, { durations: [], averageMs: 0, samples: 0 }]));
    }
}

const answerTimes = loadAnswerTimes();

function getRecentMissCount(item) {
    const history = recentMissHistory[item.english];
    let weightedTotal = 0;
    let factor = 1.0;
    
    for (let i = history.length - 1; i >= 0; i--) {
        weightedTotal += history[i] * factor;
        factor = Math.max(0.1, factor - 0.1);
    }
    return Number(weightedTotal.toFixed(3));
}

function saveMissHistory() {
    try {
        localStorage.setItem(missHistoryStorageKey, JSON.stringify(recentMissHistory));
    } catch {}
}

function recordAppearanceMisses(item, misses) {
    const history = recentMissHistory[item.english];
    history.push(misses);
    if (history.length > 10) {
        history.shift();
    }
    saveMissHistory();
}

function saveAnswerTimes() {
    try {
        localStorage.setItem(answerTimeStorageKey, JSON.stringify(answerTimes));
    } catch {}
}

function recordAnswerTime(item, elapsedMs) {
    const record = answerTimes[item.english];
    const duration = Math.min(elapsedMs, maxTrackedAnswerTimeMs);
    record.durations.push(duration);
    if (record.durations.length > 10) {
        record.durations.shift();
    }
    record.samples = record.durations.length;
    record.averageMs = record.durations.reduce((total, sample) => total + sample, 0) / record.samples;
    saveAnswerTimes();
}

function getItemWeightDetails(item) {
    const misses = getRecentMissCount(item);
    const answerTime = answerTimes[item.english];
    const averageMs = Math.min(answerTime.averageMs, maxTrackedAnswerTimeMs);
    const appearances = answerTime.durations.length;
    const missFactor = 1 + misses;
    const timeFactor = 1 + averageMs / 5000;
    const weight = missFactor * timeFactor;
    
    let displayScore = '-';
    if (appearances > 0) {
        displayScore = Math.max(1, Math.min(99, Math.round(100 / weight)));
    }
    
    return {
        misses,
        appearances,
        averageAnswerTimeSeconds: Number((averageMs / 1000).toFixed(2)),
        weight,
        score: displayScore
    };
}

function renderWeightRanking() {
    const rankingList = document.getElementById('weightRanking');
    rankingList.replaceChildren();

    vocabularyItems
        .filter(item => selectedCategories[item.category])
        .map(item => ({ item, ...getItemWeightDetails(item) }))
        .sort((first, second) => first.appearances - second.appearances || second.weight - first.weight)
        .forEach(({ item, appearances, averageAnswerTimeSeconds, score }) => {
            const isExcluded = !!itemExclusions[item.english];
            const row = document.createElement('li');
            if (isExcluded) row.className = 'item-disabled';

            const leftDiv = document.createElement('div');
            leftDiv.className = 'ranking-left';

            const toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.className = 'ranking-toggle-btn';
            toggleBtn.textContent = isExcluded ? '🔴' : '🟢';
            toggleBtn.addEventListener('click', () => toggleItemVisibility(item.english));

            const nameSpan = document.createElement('span');
            nameSpan.textContent = item.english;

            leftDiv.append(toggleBtn, nameSpan);

            const weightSpan = document.createElement('span');
            weightSpan.className = 'ranking-weight';
            
            const timeStr = appearances > 0 ? `${averageAnswerTimeSeconds}s` : '-';
            weightSpan.textContent = `${timeStr} · ${appearances}/10 · Sc: ${score}`;

            row.append(leftDiv, weightSpan);
            rankingList.appendChild(row);
        });
}

function toggleItemVisibility(englishName) {
    const matchingItemsInActiveCats = vocabularyItems.filter(item => selectedCategories[item.category]);
    const activeCount = matchingItemsInActiveCats.filter(item => !itemExclusions[item.english]).length;

    if (!itemExclusions[englishName] && activeCount === 1) {
        document.getElementById('status').textContent = 'Keep at least one item unmuted in active categories.';
        return;
    }

    if (itemExclusions[englishName]) {
        delete itemExclusions[englishName];
    } else {
        itemExclusions[englishName] = true;
    }

    try {
        localStorage.setItem(exclusionStorageKey, JSON.stringify(itemExclusions));
    } catch {}

    renderWeightRanking();

    if (!getAvailableItems().includes(currentItem)) {
        currentItem = chooseNextItem();
        updateCard();
    } else {
        updatePracticeStats(currentItem);
    }
}

function chooseNextItem(previousItem) {
    const availableItems = getAvailableItems();
    if (availableItems.length === 0) return vocabularyItems[0];
    
    const candidates = availableItems.filter(item => item !== previousItem);
    const targetPool = candidates.length > 0 ? candidates : availableItems;
    
    const leastAppearances = Math.min(...targetPool.map(item => answerTimes[item.english].durations.length));
    const weightedCandidates = targetPool
        .filter(item => answerTimes[item.english].durations.length === leastAppearances)
        .map(item => ({ item, ...getItemWeightDetails(item) }));
        
    const totalWeight = weightedCandidates.reduce((total, selection) => total + selection.weight, 0);
    let randomWeight = Math.random() * totalWeight;

    for (const selection of weightedCandidates) {
        randomWeight -= selection.weight;
        if (randomWeight < 0) {
            return selection.item;
        }
    }
    return weightedCandidates[weightedCandidates.length - 1].item;
}

let preferredTypingMode = true;
let isTypingMode = true;
let isTypingLocked = false;
let typedPinyin = '';
let questionStartedAt = 0;
let currentRoundMisses = 0;
const answerFlashTimers = new WeakMap();

const elEmojiDisplay = document.getElementById('emojiDisplay');
const elEnglishLabel = document.getElementById('englishLabel');
const elChoices = document.getElementById('choices');
const elStatus = document.getElementById('status');
const elMissCount = document.getElementById('missCount');
const elAverageTime = document.getElementById('averageTime');
const elItemScore = document.getElementById('itemScore');
const elModeToggle = document.getElementById('modeToggle');
const elTypingPanel = document.getElementById('typingPanel');
const elTypedPinyin = document.getElementById('typedPinyin');
const elLetterKeyboard = document.getElementById('letterKeyboard');

let currentItem = chooseNextItem();

function normalizePinyin(value) {
    return value.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s/g, '');
}

function renderTypedPinyin() {
    const normalizedTarget = normalizePinyin(currentItem.pinyin);
    if (typedPinyin && !normalizedTarget.startsWith(typedPinyin)) {
        elTypedPinyin.textContent = typedPinyin;
        return;
    }
    const syllables = currentItem.pinyin.split(' ');
    let remainingLetters = typedPinyin.length;
    const displayedPinyin = syllables.map(syllable => {
        const typedLength = Math.min(remainingLetters, normalizePinyin(syllable).length);
        remainingLetters -= typedLength;
        return Array.from(syllable).slice(0, typedLength).join('');
    }).join(' ').trimEnd();
    elTypedPinyin.textContent = displayedPinyin || '...';
}

function renderLetterKeyboard() {
    const rows = [
        { letters: 'QWERTY', startColumn: 1 },
        { letters: 'UIOP', startColumn: 3 },
        { letters: 'ASDFGH', startColumn: 1 },
        { letters: 'JKLZXC', startColumn: 1 },
        { letters: 'VBNM', startColumn: 3 }
    ];
    rows.forEach((row, rowIndex) => {
        Array.from(row.letters).forEach((letter, letterIndex) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'letter-key';
            button.dataset.letter = letter;
            button.textContent = letter;
            button.setAttribute('aria-label', letter);
            button.style.gridRow = String(rowIndex + 1);
            button.style.gridColumn = String(row.startColumn + letterIndex);
            button.addEventListener('click', () => enterPinyinLetter(letter, button));
            elLetterKeyboard.appendChild(button);
        });
    });
}

function setInputMode(typingMode) {
    isTypingMode = typingMode;
    elModeToggle.checked = typingMode;
    typedPinyin = '';
    elChoices.classList.toggle('input-mode-inactive', isTypingMode);
    elChoices.setAttribute('aria-hidden', isTypingMode);
    elTypingPanel.classList.toggle('input-mode-inactive', !isTypingMode);
    elTypingPanel.setAttribute('aria-hidden', !isTypingMode);
    elStatus.textContent = '';
    renderTypedPinyin();
}

function updateInputMode() {
    preferredTypingMode = elModeToggle.checked;
    setInputMode(preferredTypingMode);
}

function enterPinyinLetter(letter, button) {
    if (!isTypingMode || isTypingLocked) return;

    typedPinyin += letter.toLowerCase();
    renderTypedPinyin();
    const normalizedTarget = normalizePinyin(currentItem.pinyin);

    if (typedPinyin === normalizedTarget) {
        flashAnswer(button, 'correct');
        isTypingLocked = true;
        setTimeout(() => completeAnswer(currentItem), 300);
    } else if (!normalizedTarget.startsWith(typedPinyin)) {
        isTypingLocked = true;
        const penalty = Math.max(1, 6 - typedPinyin.length);
        currentRoundMisses += penalty;
        updatePracticeStats(currentItem);
        flashAnswer(button, 'wrong');
        elStatus.textContent = `Pinyin incorrect (+${penalty} Misses). Switching to Choice...`;
        
        setTimeout(() => {
            setInputMode(false);
            isTypingLocked = false;
        }, 900);
    } else {
        flashAnswer(button, 'correct');
    }
}

function completeAnswer(questionItem) {
    recordAppearanceMisses(questionItem, currentRoundMisses);
    currentRoundMisses = 0;
    recordAnswerTime(questionItem, performance.now() - questionStartedAt);
    updatePracticeStats(questionItem);
    elStatus.textContent = 'Correct';
    
    elChoices.querySelectorAll('button').forEach(choice => choice.disabled = true);
    elLetterKeyboard.querySelectorAll('button').forEach(key => key.disabled = true);

    speakChinese(questionItem.chinese, () => {
        currentItem = chooseNextItem(questionItem);
        updateCard();
    });
}

function saveSelectedCategories() {
    try {
        localStorage.setItem(categoryStorageKey, JSON.stringify(selectedCategories));
    } catch {}
}

function renderCategoryFilters() {
    document.querySelectorAll('.category-toggle').forEach(button => {
        button.setAttribute('aria-pressed', selectedCategories[button.dataset.category]);
    });
}

function toggleCategory(category) {
    const activeCount = categoryOrder.filter(name => selectedCategories[name]).length;
    if (selectedCategories[category] && activeCount === 1) {
        elStatus.textContent = 'Keep at least one category selected.';
        return;
    }
    selectedCategories[category] = !selectedCategories[category];
    saveSelectedCategories();
    renderCategoryFilters();

    if (!getAvailableItems().includes(currentItem)) {
        currentItem = chooseNextItem();
    }
    updateCard();
}

document.querySelectorAll('.category-toggle').forEach(button => {
    button.addEventListener('click', () => toggleCategory(button.dataset.category));
});

function updatePracticeStats(item) {
    const details = getItemWeightDetails(item);
    const history = recentMissHistory[item.english] ? [...recentMissHistory[item.english]] : [];
    
    if (item === currentItem && currentRoundMisses > 0) {
        history.push(currentRoundMisses);
        if (history.length > 10) history.shift();
    }
    
    elMissCount.replaceChildren();
    const reversedHistory = [...history].reverse();
    let displayFactor = 1.0;
    
    if (reversedHistory.length === 0) {
        const placeholder = document.createElement('span');
        placeholder.textContent = '0';
        elMissCount.appendChild(placeholder);
    } else {
        reversedHistory.forEach((misses) => {
            const span = document.createElement('span');
            span.textContent = misses;
            span.style.opacity = displayFactor.toFixed(2);
            span.style.marginRight = '8px';
            elMissCount.appendChild(span);
            displayFactor = Math.max(0.1, displayFactor - 0.1);
        });
    }

    elAverageTime.textContent = details.appearances > 0 ? `${details.averageAnswerTimeSeconds}s` : '-';
    elItemScore.textContent = details.appearances > 0 ? `${details.score}/100` : '-';
}

function getChineseVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cmn'));
}

if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = getChineseVoice;
}

function speakChinese(text, onEnd) {
    window.speechSynthesis.cancel();
    let hasAdvanced = false;
    const fallbackTimer = window.setTimeout(advance, 5000);

    function advance() {
        if (hasAdvanced) return;
        hasAdvanced = true;
        window.clearTimeout(fallbackTimer);
        onEnd();
    }

    const utterance = new SpeechSynthesisUtterance(text);
    const targetVoice = getChineseVoice();
    if (targetVoice) {
        utterance.voice = targetVoice;
        utterance.lang = targetVoice.lang;
    } else {
        utterance.lang = 'zh-CN';
    }
    utterance.onend = advance;
    utterance.onerror = advance;

    try {
        window.speechSynthesis.speak(utterance);
    } catch {
        advance();
    }
}

function updateCard() {
    const questionItem = currentItem;
    if (isTypingMode !== preferredTypingMode) {
        setInputMode(preferredTypingMode);
    }
    questionStartedAt = performance.now();
    isTypingLocked = false;
    typedPinyin = '';
    elLetterKeyboard.querySelectorAll('button').forEach(key => key.disabled = false);
    renderTypedPinyin();
    renderWeightRanking();
    currentRoundMisses = 0;
    updatePracticeStats(questionItem);
    elEmojiDisplay.textContent = questionItem.emoji;
    elEmojiDisplay.setAttribute('aria-expanded', 'false');
    elEnglishLabel.textContent = questionItem.english;
    elEnglishLabel.classList.remove('is-visible');
    elStatus.textContent = '';
    elChoices.replaceChildren();

    const availablePool = getAvailableItems();
    if (availablePool.length === 0) return;

    const distractors = availablePool.filter(item => item !== questionItem);
    shuffleDeck(distractors);
    const choices = [questionItem, ...distractors.slice(0, 8)];
    shuffleDeck(choices);

    choices.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.innerHTML = `<span class="choice-chinese"></span><span class="choice-pinyin"></span><span class="choice-phonetic"></span>`;
        button.querySelector('.choice-chinese').textContent = item.chinese;
        button.querySelector('.choice-pinyin').textContent = item.pinyin;
        button.querySelector('.choice-phonetic').textContent = item.phonetic;
        button.addEventListener('click', () => selectAnswer(button, item, questionItem));
        elChoices.appendChild(button);
    });
}

elModeToggle.addEventListener('change', updateInputMode);

function flashAnswer(button, result) {
    if (!button) return;
    const previousTimer = answerFlashTimers.get(button);
    if (previousTimer) window.clearTimeout(previousTimer);

    button.classList.remove('correct', 'wrong');
    void button.offsetWidth;
    button.classList.add(result);
    const timer = window.setTimeout(() => {
        button.classList.remove(result);
        answerFlashTimers.delete(button);
    }, 900);
    answerFlashTimers.set(button, timer);
}

elEmojiDisplay.addEventListener('click', () => {
    elEnglishLabel.classList.add('is-visible');
    elEmojiDisplay.setAttribute('aria-expanded', 'true');
});

function selectAnswer(button, selectedItem, questionItem) {
    if (isTypingLocked) return;
    if (selectedItem !== questionItem) {
        currentRoundMisses += 1;
        flashAnswer(button, 'wrong');
        updatePracticeStats(questionItem);
        elStatus.textContent = `Try again. Missed ${currentRoundMisses} time(s) this round.`;
        return;
    }
    flashAnswer(button, 'correct');
    isTypingLocked = true;
    setTimeout(() => completeAnswer(questionItem), 300);
}

renderCategoryFilters();
renderLetterKeyboard();
setInputMode(true);
updateCard();
</script>
