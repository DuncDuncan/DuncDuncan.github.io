<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Food Flashcards with Voice Input</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    user-select: none;
}

.card {
    padding: 30px;
    cursor: pointer;
    width: 100%;
    max-width: 500px;
}

.emoji-display {
    font-size: 10rem;
    margin-bottom: 10px;
}

.chinese {
    font-size: 3rem;
    margin-top: 20px;
    color: #ffd700;
    min-height: 3.5rem;
}

.pinyin {
    font-size: 2rem;
    margin-top: 10px;
    min-height: 2.3rem;
}

.phonetic {
    font-size: 1.5rem;
    margin-top: 10px;
    color: #aaa;
    min-height: 1.8rem;
}

/* Enhanced Voice status UI with pulse effects */
.voice-status {
    margin-top: 25px;
    font-size: 1.3rem;
    color: #00ffcc;
    min-height: 1.5rem;
    font-weight: bold;
    transition: color 0.2s ease;
}

/* Diagnostic Box for Debugging */
.debug-panel {
    margin-top: 15px;
    padding: 10px;
    background: #222;
    border: 1px dashed #444;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.9rem;
    color: #888;
    max-width: 80%;
    margin-left: auto;
    margin-right: auto;
}
.debug-text {
    color: #ffaa00;
    font-weight: bold;
}

.instructions {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #777;
    left: 0;
    right: 0;
}

button, input, select, textarea, a {
  outline: none;
}

* {
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>

<div class="card" id="cardContainer" aria-live="polite">
    <div id="emojiDisplay" class="emoji-display"></div>
    <div id="chinese" class="chinese"></div>
    <div id="pinyin" class="pinyin"></div>
    <div id="phonetic" class="phonetic"></div>
    <div id="voiceStatus" class="voice-status">Tap Screen to Enable Mic</div>
    
    <!-- Live Transcript Debugger Window -->
    <div class="debug-panel">
        Live Mic Output: <span id="debugText" class="debug-text">...</span>
    </div>
</div>

<div class="instructions">
    Click card to skip/reveal • Or say the word aloud to advance!
</div>

<script>
const foods = [
    { english: "Apple", emoji: "🍎", chinese: "苹果", pinyin: "píng guǒ", phonetic: "peeng gwor" },
    { english: "Pork", emoji: "🐷", chinese: "猪肉", pinyin: "zhū ròu", phonetic: "joo roh" },
    { english: "Rice", emoji: "🍚", chinese: "米饭", pinyin: "mǐ fàn", phonetic: "mee fan" },
    { english: "Noodles", emoji: "🍜", chinese: "面条", pinyin: "miàn tiáo", phonetic: "mee-en tyaow" },
    { english: "Chicken", emoji: "🍗", chinese: "鸡肉", pinyin: "jī ròu", phonetic: "jee roh" },
    { english: "Beef", emoji: "🥩", chinese: "牛肉", pinyin: "niú ròu", phonetic: "nyoh roh" },
    { english: "Fish", emoji: "🐟", chinese: "鱼", pinyin: "yú", phonetic: "yoo" },
    { english: "Egg", emoji: "🥚", chinese: "鸡蛋", pinyin: "jī dàn", phonetic: "jee dan" },
    { english: "Bread", emoji: "🍞", chinese: "面包", pinyin: "miàn bāo", phonetic: "mee-en baow" },
    { english: "Banana", emoji: "🍌", chinese: "香蕉", pinyin: "xiāng jiāo", phonetic: "shyang jyaow" },
    { english: "Dumplings", emoji: "🥟", chinese: "饺子", pinyin: "jiǎo zi", phonetic: "jyaow dzuh" },
    { english: "Fried Rice", emoji: "🥡", chinese: "炒饭", pinyin: "chǎo fàn", phonetic: "chaow fan" }, 
    { english: "Soup", emoji: "🥣", chinese: "汤", pinyin: "tāng", phonetic: "tahng" },
    { english: "Vegetables", emoji: "🥬", chinese: "蔬菜", pinyin: "shū cài", phonetic: "shoo tsai" },
    { english: "Pork Bun", emoji: "🥮", chinese: "包子", pinyin: "bāo zi", phonetic: "baow dzuh" },
    { english: "Duck", emoji: "🦆", chinese: "鸭肉", pinyin: "yā ròu", phonetic: "yah roh" },
    { english: "Hotpot", emoji: "🍲", chinese: "火锅", pinyin: "huǒ guō", phonetic: "hwor gwor" },
    { english: "Tofu", emoji: "🍢", chinese: "豆腐", pinyin: "dòu fu", phonetic: "doh foo" }, 
    { english: "Tea", emoji: "🍵", chinese: "茶", pinyin: "chá", phonetic: "chah" },
    { english: "Water", emoji: "💧", chinese: "水", pinyin: "shuǐ", phonetic: "shway" },
    { english: "Milk", emoji: "🥛", chinese: "牛奶", pinyin: "niú nǎi", phonetic: "nyoh nai" },
    { english: "Coffee", emoji: "☕", chinese: "咖啡", pinyin: "kā fēi", phonetic: "kah fay" },
    { english: "Juice", emoji: "🧃", chinese: "果汁", pinyin: "guǒ zhī", phonetic: "gwor jir" },
    { english: "Beer", emoji: "🍺", chinese: "啤酒", pinyin: "pí jiǔ", phonetic: "pee jyoh" },
    { english: "Chili", emoji: "🌶️", chinese: "辣椒", pinyin: "là jiāo", phonetic: "lah jyaow" }, 
    { english: "Shrimp", emoji: "🍤", chinese: "虾", pinyin: "xiā", phonetic: "shyah" }          
];

function shuffleDeck(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

shuffleDeck(foods);

let currentIndex = 0;
let isRevealed = false;
let isTimeoutActive = false;

const elEmojiDisplay = document.getElementById('emojiDisplay');
const elChinese = document.getElementById('chinese');
const elPinyin = document.getElementById('pinyin');
const elPhonetic = document.getElementById('phonetic');
const elVoiceStatus = document.getElementById('voiceStatus');
const elDebugText = document.getElementById('debugText');
const cardContainer = document.getElementById('cardContainer');

// --- Text To Speech Engine ---
function getChineseVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cmn'));
}

function speakChinese(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const targetVoice = getChineseVoice();
    if (targetVoice) {
        utterance.voice = targetVoice;
        utterance.lang = targetVoice.lang;
    } else {
        utterance.lang = 'zh-CN';
    }
    window.speechSynthesis.speak(utterance);
}

// --- Speech Recognition Engine ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    // Enable interim results so users see the words instantly as they speak!
    recognition.interimResults = true; 
    recognition.lang = 'zh-CN'; 

    recognition.onstart = () => {
        elVoiceStatus.textContent = "🎙️ Listening... Speak Now";
        elVoiceStatus.style.color = "#00ffcc";
    };

    recognition.onspeechstart = () => {
        elVoiceStatus.textContent = "🔊 Processing Audio...";
        elVoiceStatus.style.color = "#ffaa00";
    };

    recognition.onresult = (event) => {
        if (isTimeoutActive) return; // Prevent parsing inputs while loading next card

        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }

        const liveText = (finalTranscript || interimTranscript).trim().toLowerCase();
        
        // Output exactly what the computer captures directly into our debug element
        elDebugText.textContent = liveText || "...";

        if (!liveText) return;

        const currentFood = foods[currentIndex];
        const cleanChinese = currentFood.chinese;
        
        // Strip punctuation and spaces out of target matching tracks
        const cleanPhonetic = currentFood.phonetic.toLowerCase().replace(/[^a-z]/g, '');
        const normalizedLive = liveText.replace(/[^a-z\u4e00-\u9fa5]/g, '');

        // Check against both true characters and raw phonetics paths
        if (liveText.includes(cleanChinese) || liveText.includes(cleanPhonetic) || normalizedLive.includes(cleanPhonetic)) {
            isTimeoutActive = true;
            elVoiceStatus.textContent = "Correct! 🎉";
            elVoiceStatus.style.color = "#00ff00";
            
            if (!isRevealed) {
                isRevealed = true;
                updateCard();
                setTimeout(() => {
                    goToNextCard();
                    isTimeoutActive = false;
                }, 2000);
            }
        }
    };

    recognition.onerror = (e) => {
        console.log("Speech Error: ", e.error);
        if (e.error === 'not-allowed') {
            elVoiceStatus.textContent = "❌ Mic Blocked! Allow mic access.";
            elVoiceStatus.style.color = "#ff3333";
        }
    };

    recognition.onend = () => {
        // Automatically wake up the mic loop safely
        try { recognition.start(); } catch(e){}
    };
} else {
    elVoiceStatus.textContent = "Web Speech API not supported.";
}

function updateCard() {
    const currentFood = foods[currentIndex];
    elEmojiDisplay.innerHTML = `<span>${currentFood.emoji}</span>`;
    
    if (isRevealed) {
        elChinese.textContent = currentFood.chinese;
        elPinyin.textContent = currentFood.pinyin;
        elPhonetic.textContent = currentFood.phonetic;
        speakChinese(currentFood.chinese);
    } else {
        elChinese.textContent = "";
        elPinyin.textContent = "";
        elPhonetic.textContent = "";
        elDebugText.textContent = "...";
        elVoiceStatus.textContent = "🎙️ Listening... Speak Now";
        elVoiceStatus.style.color = "#00ffcc";
    }
}

function goToNextCard() {
    isRevealed = false;
    currentIndex = (currentIndex + 1) % foods.length;
    updateCard();
}

cardContainer.addEventListener('click', (e) => {
    e.stopPropagation();
    if (recognition) {
        try { recognition.start(); } catch(err) {}
    }
