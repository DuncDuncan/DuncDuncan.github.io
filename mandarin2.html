<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Food Flashcards with Voice Input</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    user-select: none;
}

.card {
    padding: 30px;
    width: 100%;
    max-width: 500px;
}

.emoji-display {
    font-size: 10rem;
    margin-bottom: 10px;
}

.chinese {
    font-size: 3rem;
    margin-top: 20px;
    color: #ffd700;
    min-height: 3.5rem;
}

.pinyin {
    font-size: 2rem;
    margin-top: 10px;
    min-height: 2.3rem;
}

.phonetic {
    font-size: 1.5rem;
    margin-top: 10px;
    color: #aaa;
    min-height: 1.8rem;
}

/* Mic Button Interface */
.mic-control-btn {
    background: #e62117;
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 15px;
    box-shadow: 0 4px 15px rgba(230, 33, 23, 0.4);
    transition: all 0.3s ease;
}

.mic-control-btn.active {
    background: #00ffcc;
    color: #111;
    box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
}

.voice-status {
    margin-top: 15px;
    font-size: 1.2rem;
    color: #888;
    min-height: 1.5rem;
}

.debug-panel {
    margin-top: 15px;
    padding: 10px;
    background: #222;
    border: 1px dashed #444;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.9rem;
    color: #666;
}

.debug-text {
    color: #ffaa00;
    font-weight: bold;
}

.instructions {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #777;
    left: 0;
    right: 0;
}
</style>
</head>
<body>

<div class="card" aria-live="polite">
    <div id="emojiDisplay" class="emoji-display"></div>
    <div id="chinese" class="chinese"></div>
    <div id="pinyin" class="pinyin"></div>
    <div id="phonetic" class="phonetic"></div>
    
    <!-- Dedicated hardware-waking action target element -->
    <button id="micToggleBtn" class="mic-control-btn">🔴 Click to Turn Mic ON</button>
    <div id="voiceStatus" class="voice-status">Microphone is offline</div>
    
    <div class="debug-panel">
        Live Mic Transcription: <span id="debugText" class="debug-text">...</span>
    </div>
</div>

<div class="instructions">
    Turn mic ON • Say your answer aloud • Or click emoji to reveal/skip
</div>

<script>
// Vocabulary structure re-mapped with specific alternative vocal matching arrays
const foods = [
    { english: "Water", emoji: "💧", chinese: "水", pinyin: "shuǐ", phonetic: "shway", matches: ["shway", "schway", "show way", "away", "sway", "water"] },
    { english: "Rice", emoji: "🍚", chinese: "米饭", pinyin: "mǐ fàn", phonetic: "mee fan", matches: ["mee fan", "meefan", "mi fan", "me fan"] },
    { english: "Noodles", emoji: "🍜", chinese: "面条", pinyin: "miàn tiáo", phonetic: "mee-en tyaow", matches: ["mee en tyaow", "mien tyaow", "meen tyaow", "noodles"] },
    { english: "Apple", emoji: "🍎", chinese: "苹果", pinyin: "píng guǒ", phonetic: "peeng gwor", matches: ["peeng gwor", "ping gwor", "pink war", "apple"] },
    { english: "Pork", emoji: "🐷", chinese: "猪肉", pinyin: "zhū ròu", phonetic: "joo roh", matches: ["joo roh", "drew row", "ju row", "pork"] },
    { english: "Chicken", emoji: "🍗", chinese: "鸡肉", pinyin: "jī ròu", phonetic: "jee roh", matches: ["jee roh", "g row", "gee roh", "chicken"] },
    { english: "Beef", emoji: "🥩", chinese: "牛肉", pinyin: "niú ròu", phonetic: "nyoh roh", matches: ["nyoh roh", "neo row", "new row", "beef"] },
    { english: "Fish", emoji: "🐟", chinese: "鱼", pinyin: "yú", phonetic: "yoo", matches: ["yoo", "you", "yu", "fish"] },
    { english: "Egg", emoji: "🥚", chinese: "鸡蛋", pinyin: "jī dàn", phonetic: "jee dan", matches: ["jee dan", "g dan", "gee dan", "egg"] },
    { english: "Bread", emoji: "🍞", chinese: "面包", pinyin: "miàn bāo", phonetic: "mee-en baow", matches: ["mee en baow", "men bow", "mien bao", "bread"] },
    { english: "Dumplings", emoji: "🥟", chinese: "饺子", pinyin: "jiǎo zi", phonetic: "jyaow dzuh" , matches: ["jyaow dzuh", "jiao zi", "shell za", "dumplings"] },
    { english: "Tea", emoji: "🍵", chinese: "茶", pinyin: "chá", phonetic: "chah", matches: ["chah", "cha", "tea"] }
];

let currentIndex = 0;
let isRevealed = false;
let isMicOn = false;
let processingLock = false;

const elEmojiDisplay = document.getElementById('emojiDisplay');
const elChinese = document.getElementById('chinese');
const elPinyin = document.getElementById('pinyin');
const elPhonetic = document.getElementById('phonetic');
const elVoiceStatus = document.getElementById('voiceStatus');
const elDebugText = document.getElementById('debugText');
const micToggleBtn = document.getElementById('micToggleBtn');

function getChineseVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cmn'));
}

function speakChinese(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const targetVoice = getChineseVoice();
    if (targetVoice) { utterance.voice = targetVoice; utterance.lang = targetVoice.lang; }
    else { utterance.lang = 'zh-CN'; }
    window.speechSynthesis.speak(utterance);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    // Set to parse English phonetics matches natively
    recognition.lang = 'en-US'; 

    recognition.onstart = () => {
        isMicOn = true;
        micToggleBtn.textContent = "🟢 Mic is LIVE (Listening)";
        micToggleBtn.classList.add('active');
        elVoiceStatus.textContent = "Say the word aloud...";
    };

    recognition.onresult = (event) => {
        if (processingLock) return;

        let interimTranscript = '';
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) finalTranscript += event.results[i].transcript;
            else interimTranscript += event.results[i].transcript;
        }

        const liveText = (finalTranscript || interimTranscript).trim().toLowerCase();
        elDebugText.textContent = liveText || "...";

        if (!liveText) return;

        const currentFood = foods[currentIndex];
        
        // Match against list array alternatives
        const hasMatch = currentFood.matches.some(pattern => liveText.includes(pattern));

        if (hasMatch) {
            processingLock = true;
            elVoiceStatus.textContent = "Correct Match detected! 🎉";
            elDebugText.style.color = "#00ff00";
            
            if (!isRevealed) {
                isRevealed = true;
                updateCard();
                setTimeout(() => {
                    isRevealed = false;
                    currentIndex = (currentIndex + 1) % foods.length;
                    processingLock = false;
                    elDebugText.style.color = "#ffaa00";
                    updateCard();
                }, 2000);
            }
        }
    };

    recognition.onerror = (e) => {
        if(e.error === 'not-allowed') {
            elVoiceStatus.textContent = "Permission denied. Check address bar icon!";
        }
    };

    recognition.onend = () => {
        // Keep active looping cleanly only if toggled on manually
        if (isMicOn) { try { recognition.start(); } catch(err){} }
    };
}

function updateCard() {
    const currentFood = foods[currentIndex];
    elEmojiDisplay.innerHTML = `<span>${currentFood.emoji}</span>`;
    
    if (isRevealed) {
        elChinese.textContent = currentFood.chinese;
        elPinyin.textContent = currentFood.pinyin;
        elPhonetic.textContent = currentFood.phonetic;
        speakChinese(currentFood.chinese);
    } else {
        elChinese.textContent = "";
        elPinyin.textContent = "";
        elPhonetic.textContent = "";
        elDebugText.textContent = "...";
    }
}

// Dedicated click interface target management
micToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!recognition) {
        elVoiceStatus.textContent = "Speech recognition engine un-supported.";
        return;
    }

    if (!isMicOn) {
        try {
            recognition.start();
        } catch(err) {
            console.log(err);
        }
    } else {
        isMicOn = false;
        recognition.stop();
        micToggleBtn.textContent = "🔴 Click to Turn Mic ON";
        micToggleBtn.classList.remove('active');
        elVoiceStatus.textContent = "Microphone is offline";
    }
});

elEmojiDisplay.addEventListener('click', () => {
    if (processingLock) return;
    if (!isRevealed) {
        isRevealed = true;
        updateCard();
    } else {
        isRevealed = false;
        currentIndex = (currentIndex + 1) % foods.length;
        updateCard();
    }
});

updateCard();
</script>

</body>
</html>
